<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fast Miner - Large Level</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      background: #000;
      display: block;
    }
    /* Settings Menu Style */
    #settingsMenu {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border: 1px solid white;
      color: white;
      z-index: 100;
      font-family: Arial, sans-serif;
    }
    #settingsMenu label {
      margin-right: 5px;
    }
    /* Start Menu Style */
    #startMenu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      z-index: 200;
    }
  </style>
</head>
<body>
  <!-- Start Menu -->
  <div id="startMenu">
    <h1>Fast Miner</h1>
    <p>Press any arrow key to start</p>
  </div>

  <!-- Settings Menu -->
  <div id="settingsMenu">
    <div>
      <label for="volumeSlider">Effect Volume</label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
    <div>
      <label for="musicVolumeSlider">Music Volume</label>
      <input type="range" id="musicVolumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>
  <script>
    /***************************************
     * GLOBAL CONFIGURATION & VARIABLES
     ***************************************/
    const canvas = document.getElementById("gameCanvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext("2d");

    const tileSize = 32;
    const CHUNK_SIZE = 16; // 16x16 tiles per chunk
    const VISION_RADIUS = 5;
    const MAX_CHUNK_DISTANCE = 32; // Unload chunks further than this from player

    const spawnSize = 5;
    const spawnHalf = Math.floor(spawnSize / 2);
    const spawnCenterX = 0; // Spawn at world origin
    const spawnCenterY = 0;
    const spawnXStart = spawnCenterX - spawnHalf;
    const spawnXEnd   = spawnCenterX + spawnHalf;
    const spawnYStart = spawnCenterY - spawnHalf;
    const spawnYEnd   = spawnCenterY + spawnHalf;

    const maxLevel = 10;
    let currentLevel = 1;

    // Chunk-based storage: Map of "chunkX_chunkY_level" -> chunk data
    let chunks = new Map();
    let doorStates = {}; // Track door states per level: { level: { locked: bool } }
    let playerHasLeftPortal = false;
    let inventoryOpen = false;
    let shopOpen = false;
    let skillTreeOpen = false;
    let shopDrillButtonRect = null;
    let shopSizeButtonRect = null;
    let shopVisionButtonRect = null;
    let shopSpeedButtonRect = null;
    let skillTreeButtonRect = null;

    let player = {
      x: 0,
      y: 0,
      direction: "up",
      materials: {},
      drillUpgradeLevel: 0,
      size: 1,
      visionUpgradeLevel: 0,
      drillSpeedLevel: 0,
      comboStreak: 0,
      lastMineTime: 0
    };

    const portalLocations = {};

    // Flag to determine if the game has started.
    let gameStarted = false;

    /***************************************
     * CHUNK MANAGEMENT SYSTEM
     ***************************************/

    // Convert world coordinates to chunk coordinates
    function worldToChunk(x, y) {
      return {
        chunkX: Math.floor(x / CHUNK_SIZE),
        chunkY: Math.floor(y / CHUNK_SIZE),
        localX: ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE,
        localY: ((y % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE
      };
    }

    // Get chunk key for storage
    function getChunkKey(chunkX, chunkY, level) {
      return `${chunkX}_${chunkY}_${level}`;
    }

    // Get or create a chunk
    function getChunk(chunkX, chunkY, level) {
      const key = getChunkKey(chunkX, chunkY, level);
      if (!chunks.has(key)) {
        chunks.set(key, generateChunk(chunkX, chunkY, level));
      }
      return chunks.get(key);
    }

    // Get tile at world coordinates
    function getTileAt(x, y, level) {
      const { chunkX, chunkY, localX, localY } = worldToChunk(x, y);
      const chunk = getChunk(chunkX, chunkY, level);
      return chunk.tiles[localY][localX];
    }

    // Set tile at world coordinates
    function setTileAt(x, y, level, tileData) {
      const { chunkX, chunkY, localX, localY } = worldToChunk(x, y);
      const chunk = getChunk(chunkX, chunkY, level);
      chunk.tiles[localY][localX] = tileData;
    }

    // Unload chunks far from player
    function unloadDistantChunks() {
      const playerChunk = worldToChunk(player.x, player.y);
      const toDelete = [];

      for (let key of chunks.keys()) {
        const [chunkX, chunkY, level] = key.split('_').map(Number);
        if (level !== currentLevel) continue;

        const dx = Math.abs(chunkX - playerChunk.chunkX);
        const dy = Math.abs(chunkY - playerChunk.chunkY);

        if (dx > MAX_CHUNK_DISTANCE || dy > MAX_CHUNK_DISTANCE) {
          toDelete.push(key);
        }
      }

      toDelete.forEach(key => chunks.delete(key));
    }

    // Load chunks in viewport
    function loadVisibleChunks(cameraX, cameraY) {
      const startChunkX = Math.floor(cameraX / (CHUNK_SIZE * tileSize));
      const endChunkX = Math.ceil((cameraX + canvas.width) / (CHUNK_SIZE * tileSize));
      const startChunkY = Math.floor(cameraY / (CHUNK_SIZE * tileSize));
      const endChunkY = Math.ceil((cameraY + canvas.height) / (CHUNK_SIZE * tileSize));

      for (let cy = startChunkY; cy <= endChunkY; cy++) {
        for (let cx = startChunkX; cx <= endChunkX; cx++) {
          getChunk(cx, cy, currentLevel);
        }
      }
    }

    /***************************************
     * AUDIO SETUP
     ***************************************/
    let effectVolume = 1.0;
    let musicVolume = 1.0;

    const soundEffects = {
      doorOpen: new Audio("sounds/Door_open.mp3"),
      levelTransition: new Audio("sounds/Level_transition.mp3"),
      skillUpgradeConfirmation: new Audio("sounds/Skill_upgrade_confirmation.mp3"),
      groundMining: new Audio("sounds/ground_mining.mp3"),
      oreHit: new Audio("sounds/ore_hit.mp3"),
      purchaseFailure: new Audio("sounds/purchase_failure.mp3"),
      inventoryToggle: new Audio("sounds/Inventory_toggle.mp3"),
      skillUpgrade: new Audio("sounds/Skill_Upgrade.mp3"),
      doorDrilling: new Audio("sounds/door_drilling.mp3"),
      oreCrack: new Audio("sounds/ore_crack.mp3"),
      playerMovement: new Audio("sounds/player_movement.mp3"),
      purchaseSuccess: new Audio("sounds/purchase_success.mp3")
    };

    function updateSoundVolumes() {
      for (let key in soundEffects) {
        soundEffects[key].volume = effectVolume;
      }
    }
    updateSoundVolumes();

    function playSound(key) {
      if (!soundEffects[key]) return;
      let sound = soundEffects[key].cloneNode();
      sound.volume = effectVolume;
      sound.play();
    }

    // Background Music Setup
    const bgSongs = [
      new Audio("sounds/song_1.mp3"),
      new Audio("sounds/song_2.mp3"),
      new Audio("sounds/song_3.mp3")
    ];
    let currentSongIndex = 0;
    function playNextSong() {
      const currentSong = bgSongs[currentSongIndex];
      currentSong.volume = musicVolume;
      currentSong.play();
      currentSong.onended = () => {
        currentSongIndex = (currentSongIndex + 1) % bgSongs.length;
        playNextSong();
      };
    }

    /***************************************
     * SETTINGS MENU (Volume Sliders)
     ***************************************/
    const volumeSlider = document.getElementById("volumeSlider");
    volumeSlider.addEventListener("input", (event) => {
      effectVolume = parseFloat(event.target.value);
      updateSoundVolumes();
    });

    const musicVolumeSlider = document.getElementById("musicVolumeSlider");
    musicVolumeSlider.addEventListener("input", (event) => {
      musicVolume = parseFloat(event.target.value);
      bgSongs[currentSongIndex].volume = musicVolume;
    });

    /***************************************
     * START MENU
     ***************************************/
    const startMenu = document.getElementById("startMenu");
    function startGame() {
      if (!gameStarted) {
        gameStarted = true;
        startMenu.style.display = "none";
        playNextSong();
        render();
      }
    }
    document.addEventListener("keydown", (event) => {
      const key = event.key;
      if (!gameStarted && (key === "ArrowUp" || key === "ArrowDown" || key === "ArrowLeft" || key === "ArrowRight")) {
        startGame();
      }
    });
    document.addEventListener("click", () => {
      if (!gameStarted) startGame();
    });

    /***************************************
     * SKILL TREE: MINERAL-SPECIFIC UPGRADES
     ***************************************/
    const mineralList = ["Copper", "Iron", "Gold", "Emerald", "Sapphire", "Ruby", "Diamond", "Amethyst", "Topaz", "Obsidian"];
    const mineralSkillTrees = {};
    mineralList.forEach(mineral => {
      mineralSkillTrees[mineral] = {
        xp: 0,
        upgrades: {
          tier1: null,
          tier2: null,
          tier3: null,
          tier4: null
        }
      };
    });
    const upgradeThresholds = { tier1: 25, tier2: 75, tier3: 200, tier4: 500 };
    const skillUpgradeOptions = {
      tier1: { power: "+50% damage", yield: "+25% yield" },
      tier2: { power: "+100% damage (2× total)", yield: "+50% yield" },
      tier3: { power: "+200% damage (3× total)", yield: "+100% yield (2× total)" },
      tier4: { power: "+400% damage (5× total) + pierce", yield: "+150% yield (2.5× total)" }
    };

    /***************************************
     * MAPPING & SCALING DATA
     ***************************************/
    const oreMapping = {
      1: { mineral: "Copper",   color: "#B87333", baseHP: 8, rarity: 0.30 },
      2: { mineral: "Iron",     color: "#808080", baseHP: 12, rarity: 0.30 },
      3: { mineral: "Gold",     color: "#FFD700", baseHP: 18, rarity: 0.15 },
      4: { mineral: "Emerald",  color: "#50C878", baseHP: 27, rarity: 0.15 },
      5: { mineral: "Sapphire", color: "#0F52BA", baseHP: 40, rarity: 0.15 },
      6: { mineral: "Ruby",     color: "#E0115F", baseHP: 60, rarity: 0.08 },
      7: { mineral: "Diamond",  color: "#B9F2FF", baseHP: 90, rarity: 0.08 },
      8: { mineral: "Amethyst", color: "#9966CC", baseHP: 135, rarity: 0.08 },
      9: { mineral: "Topaz",    color: "#FFC87C", baseHP: 200, rarity: 0.03 },
      10: { mineral: "Obsidian", color: "#1C1C1C", baseHP: 300, rarity: 0.03 }
    };
    // Smooth exponential scaling: HP = 5 × 1.5^(level-1)
    const levelHpScaling = { 1: 5, 2: 8, 3: 12, 4: 18, 5: 27, 6: 40, 7: 60, 8: 90, 9: 135, 10: 200 };
    function getGroundColorForLevel(level) {
      let lightness;
      switch (level) {
        case 1: lightness = 70; break;
        case 2: lightness = 65; break;
        case 3: lightness = 60; break;
        case 4: lightness = 55; break;
        case 5: lightness = 50; break;
        case 6: lightness = 45; break;
        case 7: lightness = 40; break;
        case 8: lightness = 35; break;
        case 9: lightness = 30; break;
        case 10: lightness = 25; break;
        default: lightness = 70;
      }
      return `hsl(30,80%,${lightness}%)`;
    }

    /***************************************
     * CHUNK GENERATION & DOOR PLACEMENT
     ***************************************/

    // Seeded random for consistent chunk generation
    function seededRandom(chunkX, chunkY, level, localX, localY) {
      const seed = (chunkX * 73856093) ^ (chunkY * 19349663) ^ (level * 83492791) ^ (localX * 7919) ^ (localY * 6971);
      const x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function generateChunk(chunkX, chunkY, level) {
      let tiles = Array.from({ length: CHUNK_SIZE }, () =>
        Array.from({ length: CHUNK_SIZE }, () => ({ }))
      );

      for (let localY = 0; localY < CHUNK_SIZE; localY++) {
        for (let localX = 0; localX < CHUNK_SIZE; localX++) {
          const worldX = chunkX * CHUNK_SIZE + localX;
          const worldY = chunkY * CHUNK_SIZE + localY;

          let tile = {
            revealed: false,
            visible: false,
            beingMined: false,
            animationStartTime: 0
          };

          // Check if in spawn area
          const inSpawn = (worldX >= spawnXStart && worldX <= spawnXEnd &&
                          worldY >= spawnYStart && worldY <= spawnYEnd);

          if (inSpawn) {
            tile.type = "mined";
            tile.hp = 0;
            tile.maxHp = 0;
            tile.revealed = true;
            tile.visible = true;
            tile.resource = null;

            // Place prev door at spawn center
            if (level > 1 && worldX === spawnCenterX && worldY === spawnCenterY) {
              tile.type = "door";
              tile.doorFor = "prev";
              tile.doorState = "open";
              tile.hp = 0;
              tile.maxHp = 0;
            }
          } else {
            const random = seededRandom(chunkX, chunkY, level, localX, localY);
            const oreRarity = oreMapping[level].rarity;

            if (random < oreRarity) {
              tile.type = "ore";
              tile.resource = oreMapping[level].mineral;
              tile.hp = oreMapping[level].baseHP;
              tile.maxHp = tile.hp;

              // Quality tier system (70% normal, 25% high, 5% perfect)
              const qualityRoll = seededRandom(chunkX, chunkY, level, localX + 1000, localY + 1000);
              if (qualityRoll < 0.05) {
                tile.quality = "perfect";
                tile.qualityMultiplier = 5;
              } else if (qualityRoll < 0.30) {
                tile.quality = "high";
                tile.qualityMultiplier = 2;
              } else {
                tile.quality = "normal";
                tile.qualityMultiplier = 1;
              }
            } else {
              tile.type = "ground";
              tile.hp = levelHpScaling[level];
              tile.maxHp = tile.hp;
            }

            // Reveal tiles around spawn
            const inSpawnReveal = (worldX >= spawnXStart - 1 && worldX <= spawnXEnd + 1 &&
                                  worldY >= spawnYStart - 1 && worldY <= spawnYEnd + 1);
            if (inSpawnReveal) {
              tile.revealed = true;
              tile.visible = true;
            }
          }

          // Place next door in a specific location (deterministic but varied per level)
          const doorRange = 20;
          // Use level-based offset for variety (each level has different door position)
          const doorOffsetX = doorRange + (level * 3) % 10;
          const doorOffsetY = doorRange + (level * 7) % 10;
          if (worldX === spawnCenterX + doorOffsetX && worldY === spawnCenterY + doorOffsetY) {
            tile.type = "door";
            tile.doorFor = "next";
            // Check if door was previously unlocked
            if (!doorStates[level]) doorStates[level] = { nextDoorLocked: true };
            tile.doorState = doorStates[level].nextDoorLocked ? "locked" : "open";
            tile.hp = doorStates[level].nextDoorLocked ? (50 + level * 20) : 0;
            tile.maxHp = 50 + level * 20;
            tile.revealed = false;
            tile.visible = false;
            tile.resource = null;
          }

          tiles[localY][localX] = tile;
        }
      }

      return { tiles };
    }

    // Initialize player position
    player.x = spawnCenterX;
    player.y = spawnCenterY;
    playerHasLeftPortal = false;

    // Initialize door states for all levels
    for (let level = 1; level <= maxLevel; level++) {
      doorStates[level] = { nextDoorLocked: true };
    }

    // Pre-generate spawn chunks
    const spawnChunk = worldToChunk(spawnCenterX, spawnCenterY);
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        getChunk(spawnChunk.chunkX + dx, spawnChunk.chunkY + dy, currentLevel);
      }
    }

    /***************************************
     * VISION SYSTEM (Fog of War)
     ***************************************/
    function updateVision() {
      const visionRange = player.visionUpgradeLevel + 1;
      if (!portalLocations[currentLevel]) { portalLocations[currentLevel] = {}; }

      // First pass: Reset visibility for loaded chunks
      for (let [key, chunk] of chunks) {
        const [chunkX, chunkY, level] = key.split('_').map(Number);
        if (level !== currentLevel) continue;

        for (let localY = 0; localY < CHUNK_SIZE; localY++) {
          for (let localX = 0; localX < CHUNK_SIZE; localX++) {
            chunk.tiles[localY][localX].visible = false;
          }
        }
      }

      // Second pass: Reveal from mined tiles
      for (let [key, chunk] of chunks) {
        const [chunkX, chunkY, level] = key.split('_').map(Number);
        if (level !== currentLevel) continue;

        for (let localY = 0; localY < CHUNK_SIZE; localY++) {
          for (let localX = 0; localX < CHUNK_SIZE; localX++) {
            const tile = chunk.tiles[localY][localX];
            if (tile.type === "mined") {
              const worldX = chunkX * CHUNK_SIZE + localX;
              const worldY = chunkY * CHUNK_SIZE + localY;
              revealSurroundingTiles(worldX, worldY, visionRange);
            }
          }
        }
      }

      // Third pass: Update portal locations
      for (let [key, chunk] of chunks) {
        const [chunkX, chunkY, level] = key.split('_').map(Number);
        if (level !== currentLevel) continue;

        for (let localY = 0; localY < CHUNK_SIZE; localY++) {
          for (let localX = 0; localX < CHUNK_SIZE; localX++) {
            const tile = chunk.tiles[localY][localX];
            if (tile.visible && tile.type === "door") {
              const worldX = chunkX * CHUNK_SIZE + localX;
              const worldY = chunkY * CHUNK_SIZE + localY;

              if (tile.doorFor === "next") {
                portalLocations[currentLevel].next = { x: worldX, y: worldY };
              } else if (tile.doorFor === "prev") {
                portalLocations[currentLevel].prev = { x: worldX, y: worldY };
              }
            }
          }
        }
      }
    }

    function revealSurroundingTiles(centerX, centerY, range) {
      for (let dy = -range; dy <= range; dy++) {
        for (let dx = -range; dx <= range; dx++) {
          const x = centerX + dx;
          const y = centerY + dy;

          const { chunkX, chunkY, localX, localY } = worldToChunk(x, y);
          const chunk = getChunk(chunkX, chunkY, currentLevel);

          chunk.tiles[localY][localX].visible = true;
          chunk.tiles[localY][localX].revealed = true;
        }
      }
    }

    /***************************************
     * SKILL UPGRADE HANDLING
     ***************************************/

    // Get count of available upgrades across all minerals
    function getAvailableUpgradesCount() {
      let count = 0;
      mineralList.forEach(mineral => {
        let skill = mineralSkillTrees[mineral];
        for (let tier of ["tier1", "tier2", "tier3", "tier4"]) {
          if (!skill.upgrades[tier] && skill.xp >= upgradeThresholds[tier]) {
            count++;
            break; // Only count first available per mineral
          }
        }
      });
      return count;
    }

    // Get first available tier for a mineral
    function getAvailableTier(mineral) {
      let skill = mineralSkillTrees[mineral];
      for (let tier of ["tier1", "tier2", "tier3", "tier4"]) {
        if (!skill.upgrades[tier] && skill.xp >= upgradeThresholds[tier]) {
          return tier;
        }
      }
      return null;
    }

    // Apply skill upgrade
    function applySkillUpgrade(mineral, tier, choice) {
      mineralSkillTrees[mineral].upgrades[tier] = choice;
      console.log(`Upgraded ${mineral} ${tier}: ${choice}`);
      playSound("skillUpgradeConfirmation");
    }

    /***************************************
     * LEVEL TRANSITION FUNCTIONS
     ***************************************/
    function transitionToLevel(newLevel) {
      if (newLevel < 1) return;
      if (newLevel > maxLevel) {
        alert("Congratulations! You have completed the game!");
        return;
      }

      // Save current level state
      const previousLevel = currentLevel;

      // Transition to new level
      currentLevel = newLevel;
      player.x = spawnCenterX;
      player.y = spawnCenterY;
      playerHasLeftPortal = false;

      // Break combo on level transition
      player.comboStreak = 0;
      player.lastMineTime = 0;

      // Close shop, inventory, and skill tree
      shopOpen = false;
      inventoryOpen = false;
      skillTreeOpen = false;

      // Initialize door state for this level if not exists
      if (!doorStates[newLevel]) {
        doorStates[newLevel] = { nextDoorLocked: true };
      }

      // Pre-generate spawn chunks for new level
      const spawnChunk = worldToChunk(spawnCenterX, spawnCenterY);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          getChunk(spawnChunk.chunkX + dx, spawnChunk.chunkY + dy, currentLevel);
        }
      }

      // Force vision update to reveal spawn area
      updateVision();

      // Display level transition message
      displayLevelTransition(newLevel);

      console.log(`Transitioned from Level ${previousLevel} to Level ${newLevel}`);
      playSound("levelTransition");
    }

    /***************************************
     * MOVEMENT, COLLISION & ATTACK (Player Size)
     ***************************************/
    let lastDamageTimes = { up: 0, down: 0, left: 0, right: 0 };
    let currentDirection = null;
    let isMoving = false;
    const TAP_MOVE_COOLDOWN = 50;
    let lastPlayerMovementSoundTime = 0;
    const PLAYER_MOVEMENT_SOUND_INTERVAL = 300;

    // Drill speed upgrade levels
    function getContinuousMoveInterval() {
      const baseInterval = 250;
      if (player.drillSpeedLevel === 0) return baseInterval;
      if (player.drillSpeedLevel === 1) return 200;
      if (player.drillSpeedLevel === 2) return 150;
      if (player.drillSpeedLevel >= 3) return 100;
      return baseInterval;
    }

    // Combo system
    function updateCombo() {
      const now = Date.now();
      if (now - player.lastMineTime > 3000) {
        player.comboStreak = 0;
      } else {
        player.comboStreak++;
      }
      player.lastMineTime = now;
    }

    function getComboMultiplier() {
      if (player.comboStreak >= 50) return 1.5;
      if (player.comboStreak >= 25) return 1.25;
      if (player.comboStreak >= 10) return 1.1;
      return 1.0;
    }

    function getDirectionFromKey(key) {
      if (key === "ArrowUp") return "up";
      if (key === "ArrowDown") return "down";
      if (key === "ArrowLeft") return "left";
      if (key === "ArrowRight") return "right";
      return null;
    }

    function tryMove(dx, dy) {
      let newX = player.x + dx, newY = player.y + dy;

      // Check passability
      let fullyPassable = true;
      for (let i = 0; i < player.size; i++) {
        for (let j = 0; j < player.size; j++) {
          let tile = getTileAt(newX + i, newY + j, currentLevel);
          if (tile.type !== "mined" && !(tile.type === "door" && tile.doorFor === "prev")) {
            fullyPassable = false;
            break;
          }
        }
        if (!fullyPassable) break;
      }

      if (fullyPassable) {
        let steppedOnPortal = false;
        for (let i = 0; i < player.size; i++) {
          for (let j = 0; j < player.size; j++) {
            let tile = getTileAt(newX + i, newY + j, currentLevel);
            if (tile.type === "door" && tile.doorFor === "prev") steppedOnPortal = true;
          }
        }
        player.x = newX;
        player.y = newY;
        if (Date.now() - lastPlayerMovementSoundTime > PLAYER_MOVEMENT_SOUND_INTERVAL) {
          playSound("playerMovement");
          lastPlayerMovementSoundTime = Date.now();
        }
        if (steppedOnPortal && playerHasLeftPortal) { transitionToLevel(currentLevel - 1); return; }
        return;
      } else {

        // Update combo
        updateCombo();

        // Base damage with size penalty
        let baseDamage = 1 + player.drillUpgradeLevel;
        let sizePenalty = 1.0;
        if (player.size === 2) sizePenalty = 0.75;  // -25% damage
        if (player.size === 3) sizePenalty = 0.60;  // -40% damage
        baseDamage *= sizePenalty;

        // Combo multiplier
        const comboMult = getComboMultiplier();
        baseDamage *= comboMult;

        for (let i = 0; i < player.size; i++) {
          for (let j = 0; j < player.size; j++) {
            let tile = getTileAt(newX + i, newY + j, currentLevel);
            if (!tile.beingMined) {
              tile.beingMined = true;
              tile.animationStartTime = Date.now();
            }
            tile.beingMined = true;

            if (tile.type === "door") {
              if (tile.doorFor === "next") {
                if (tile.doorState === "locked") {
                  playSound("doorDrilling");
                  tile.hp -= baseDamage;
                  console.log(`Damaging NEXT door at (${newX+i},${newY+j}). Remaining HP: ${tile.hp}/${tile.maxHp}`);
                  if (tile.hp <= 0) {
                    tile.hp = 0;
                    tile.doorState = "open";
                    // Save door state persistently
                    if (!doorStates[currentLevel]) doorStates[currentLevel] = {};
                    doorStates[currentLevel].nextDoorLocked = false;
                    console.log("Next door is now open!");
                    playSound("doorOpen");
                  }
                } else if (tile.doorState === "open") {
                  transitionToLevel(currentLevel + 1);
                  return;
                }
              }
            } else if (tile.type === "ground" || tile.type === "ore") {
              let isOre = (tile.type === "ore" && tile.resource);
              let damageMultiplier = 1.0;
              let pierce = false;

              if (isOre) {
                let mineral = tile.resource;
                let skill = mineralSkillTrees[mineral];
                if (skill) {
                  // New power path: percentage multipliers
                  if (skill.upgrades.tier1 === "power") damageMultiplier += 0.5;   // +50%
                  if (skill.upgrades.tier2 === "power") damageMultiplier += 1.0;   // +100% (2× total)
                  if (skill.upgrades.tier3 === "power") damageMultiplier += 2.0;   // +200% (3× total)
                  if (skill.upgrades.tier4 === "power") {
                    damageMultiplier += 4.0;  // +400% (5× total)
                    pierce = true;
                  }
                }
              }

              let totalDamage = baseDamage * damageMultiplier;
              tile.hp -= totalDamage;
              if (tile.type === "ground") { playSound("groundMining"); }
              if (tile.type === "ore") {
                if (tile.hp > 0) { playSound("oreHit"); }
              }
              console.log(`Damaging tile at (${newX+i},${newY+j}). Damage: ${totalDamage.toFixed(1)} (${player.comboStreak}x combo). Remaining HP: ${tile.hp}/${tile.maxHp}`);

              if (tile.hp <= 0) {
                tile.beingMined = false;
                tile.hp = 0;
                tile.type = "mined";
                if (tile.resource) {
                  if (isOre) {
                    let mineral = tile.resource;
                    let skill = mineralSkillTrees[mineral];
                    if (skill) { skill.xp += 1; }

                    // New yield path: percentage multipliers
                    let yieldMultiplier = 1.0;
                    if (skill) {
                      if (skill.upgrades.tier1 === "yield") yieldMultiplier += 0.25;   // +25%
                      if (skill.upgrades.tier2 === "yield") yieldMultiplier += 0.50;   // +50%
                      if (skill.upgrades.tier3 === "yield") yieldMultiplier += 1.00;   // +100% (2× total)
                      if (skill.upgrades.tier4 === "yield") yieldMultiplier += 1.50;   // +150% (2.5× total)
                    }

                    // Apply quality multiplier
                    const qualityMult = tile.qualityMultiplier || 1;
                    let yieldAmount = Math.ceil(yieldMultiplier * qualityMult);

                    player.materials[mineral] = (player.materials[mineral] || 0) + yieldAmount;
                    playSound("oreCrack");
                    console.log(`Collected ${yieldAmount} ${mineral} (${tile.quality || 'normal'}). Total ${mineral}: ${player.materials[mineral]}`);
                  }
                  tile.resource = null;
                }
              }
            }
          }
        }
        updateVision();
      }
    }

    function getDrillUpgradeCost() {
      const level = player.drillUpgradeLevel + 1;
      const n = level;
      if (level <= 5) return { Copper: 5 * n };
      if (level <= 10) return { Copper: 5 * n, Iron: 2 * n };
      if (level <= 15) return { Copper: 5 * n, Gold: 3 * n, Emerald: n };
      return { Copper: 5 * n, Diamond: 2 * n, Obsidian: n };
    }

    function getSizeUpgradeCost() {
      if (player.size === 1) return { Copper: 50, Iron: 10, Gold: 5 };
      if (player.size === 2) return { Copper: 200, Diamond: 20, Ruby: 10 };
      return null;
    }

    function getVisionUpgradeCost() {
      const level = player.visionUpgradeLevel + 1;
      if (level <= 3) return { Copper: 10 * level };
      if (level <= 6) return { Gold: 15 * level, Emerald: 5 * level };
      return { Ruby: 10 * level, Diamond: 5 * level };
    }

    function getDrillSpeedCost() {
      if (player.drillSpeedLevel === 0) return { Iron: 50 };
      if (player.drillSpeedLevel === 1) return { Gold: 100 };
      if (player.drillSpeedLevel === 2) return { Sapphire: 200 };
      return null;
    }

    function canAfford(cost) {
      for (let mineral in cost) {
        if ((player.materials[mineral] || 0) < cost[mineral]) return false;
      }
      return true;
    }

    function payCost(cost) {
      for (let mineral in cost) {
        player.materials[mineral] = (player.materials[mineral] || 0) - cost[mineral];
      }
    }

    function costToString(cost) {
      if (!cost) return "MAX";
      return Object.entries(cost).map(([mineral, amount]) => `${amount} ${mineral}`).join(", ");
    }

        // XP Progress bar

        const barWidth = 200;
        const barHeight = 20;

        ctx.fillRect(barX, y + 15, barWidth, barHeight);
        ctx.fillStyle = mineralColors[mineral];

        ctx.lineWidth = 1;
        ctx.strokeRect(barX, y + 15, barWidth, barHeight);

        ctx.fillStyle = "white";
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(`${skill.xp} XP`, barX + barWidth / 2, y + 29);

        // Tier buttons
        tiers.forEach((tier, tierIndex) => {
          const tierThreshold = upgradeThresholds[tier];
          const isUnlocked = skill.upgrades[tier] !== null;
          const isAvailable = !isUnlocked && skill.xp >= tierThreshold;
          const isLocked = skill.xp < tierThreshold;

          const buttonX = tierX[tierIndex];
          const buttonY = y + 10;
          const buttonW = 100;
          const buttonH = 40;

          // Button background
          if (isUnlocked) {
            ctx.fillStyle = skill.upgrades[tier] === "power" ? "#4a9eff" : "#ff9a4a";
          } else if (isAvailable) {
            ctx.fillStyle = "#44ff44";
          } else {
            ctx.fillStyle = "#444";
          }
          ctx.fillRect(buttonX, buttonY, buttonW, buttonH);
          ctx.strokeStyle = isAvailable ? "#ffff00" : "#888";
          ctx.lineWidth = isAvailable ? 3 : 1;
          ctx.strokeRect(buttonX, buttonY, buttonW, buttonH);

          // Text
          ctx.fillStyle = isLocked ? "#666" : "white";
          ctx.font = "11px Arial";
          ctx.textAlign = "center";
          if (isUnlocked) {
            ctx.fillText(skill.upgrades[tier] === "power" ? "POWER" : "YIELD", buttonX + buttonW / 2, buttonY + 18);
            ctx.font = "9px Arial";
            ctx.fillText(skillUpgradeOptions[tier][skill.upgrades[tier]].substring(0, 20), buttonX + buttonW / 2, buttonY + 32);
          } else {
            ctx.fillText(`Tier ${tierIndex + 1}`, buttonX + buttonW / 2, buttonY + 15);
            ctx.font = "9px Arial";
            ctx.fillText(`${tierThreshold} XP`, buttonX + buttonW / 2, buttonY + 28);
            if (isAvailable) {
              ctx.fillStyle = "yellow";
              ctx.fillText("READY!", buttonX + buttonW / 2, buttonY + 38);
            }
          }
        });
      });

      // Instructions at bottom
      ctx.fillStyle = "white";
      ctx.font = "16px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Click on a green READY! upgrade to choose Power or Yield", canvas.width / 2, canvas.height - 30);

      ctx.restore();
    }

        const tiers = ["tier1", "tier2", "tier3", "tier4"];
        const tierX = [420, 560, 700, 840];

        mineralList.forEach((mineral, index) => {
          const y = startY + index * rowHeight;
          const skill = mineralSkillTrees[mineral];
          const availableTier = getAvailableTier(mineral);

          if (availableTier) {
            const tierIndex = tiers.indexOf(availableTier);
            const buttonX = tierX[tierIndex];
            const buttonY = y + 10;
            const buttonW = 100;
            const buttonH = 40;

            if (mouseX >= buttonX && mouseX <= buttonX + buttonW &&
                mouseY >= buttonY && mouseY <= buttonY + buttonH) {
              // Show choice dialog
              showSkillUpgradeChoice(mineral, availableTier);
            }
          }
        });
      }

      // Skill tree button click (always visible)
      if (skillTreeButtonRect &&
          event.clientX - canvas.getBoundingClientRect().left >= skillTreeButtonRect.x &&
          event.clientX - canvas.getBoundingClientRect().left <= skillTreeButtonRect.x + skillTreeButtonRect.width &&
          event.clientY - canvas.getBoundingClientRect().top >= skillTreeButtonRect.y &&
          event.clientY - canvas.getBoundingClientRect().top <= skillTreeButtonRect.y + skillTreeButtonRect.height) {
        skillTreeOpen = !skillTreeOpen;
        if (skillTreeOpen) {
          inventoryOpen = false;
          shopOpen = false;
        }
        playSound("inventoryToggle");
      }
    });

    // Show skill upgrade choice dialog
    let skillUpgradeChoice = null;

    function showSkillUpgradeChoice(mineral, tier) {
      skillUpgradeChoice = { mineral, tier };
    }

    function drawSkillUpgradeChoice() {
      if (!skillUpgradeChoice) return;

      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // Modal background
      ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const boxW = 600;
      const boxH = 300;
      const boxX = canvas.width / 2 - boxW / 2;
      const boxY = canvas.height / 2 - boxH / 2;

      ctx.fillStyle = "#333";
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeStyle = "white";
      ctx.lineWidth = 3;
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      // Title
      ctx.fillStyle = "white";
      ctx.font = "24px Arial";
      ctx.textAlign = "center";
      const { mineral, tier } = skillUpgradeChoice;
      ctx.fillText(`${mineral} - ${tier.toUpperCase()} Upgrade`, boxX + boxW / 2, boxY + 40);

      // Power button (left)
      const btnY = boxY + 80;
      const btnW = 250;
      const btnH = 120;
      const powerBtnX = boxX + 50;

      ctx.fillStyle = "#4a9eff";
      ctx.fillRect(powerBtnX, btnY, btnW, btnH);
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.strokeRect(powerBtnX, btnY, btnW, btnH);

      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("POWER", powerBtnX + btnW / 2, btnY + 30);
      ctx.font = "14px Arial";
      const powerText = skillUpgradeOptions[tier].power;
      ctx.fillText(powerText, powerBtnX + btnW / 2, btnY + 60);
      ctx.font = "12px Arial";
      ctx.fillText("Click to choose", powerBtnX + btnW / 2, btnY + 90);

      // Yield button (right)
      const yieldBtnX = boxX + 300;

      ctx.fillStyle = "#ff9a4a";
      ctx.fillRect(yieldBtnX, btnY, btnW, btnH);
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.strokeRect(yieldBtnX, btnY, btnW, btnH);

      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("YIELD", yieldBtnX + btnW / 2, btnY + 30);
      ctx.font = "14px Arial";
      const yieldText = skillUpgradeOptions[tier].yield;
      ctx.fillText(yieldText, yieldBtnX + btnW / 2, btnY + 60);
      ctx.font = "12px Arial";
      ctx.fillText("Click to choose", yieldBtnX + btnW / 2, btnY + 90);

      // Cancel text
      ctx.font = "14px Arial";
      ctx.fillText("Press ESC to cancel", boxX + boxW / 2, boxY + boxH - 20);

      ctx.restore();

      // Handle clicks
      canvas.onclick = (event) => {
        if (!skillUpgradeChoice) return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;

        // Power button
        if (mouseX >= powerBtnX && mouseX <= powerBtnX + btnW &&
            mouseY >= btnY && mouseY <= btnY + btnH) {
          applySkillUpgrade(mineral, tier, "power");
          skillUpgradeChoice = null;
          canvas.onclick = null;
        }

        // Yield button
        if (mouseX >= yieldBtnX && mouseX <= yieldBtnX + btnW &&
            mouseY >= btnY && mouseY <= btnY + btnH) {
          applySkillUpgrade(mineral, tier, "yield");
          skillUpgradeChoice = null;
          canvas.onclick = null;
        }
      };

      // ESC to cancel
      document.onkeydown = (event) => {
        if (event.key === "Escape" && skillUpgradeChoice) {
          skillUpgradeChoice = null;
          canvas.onclick = null;
          document.onkeydown = null;
        }
      };
    }

    /***************************************
     * RENDERING & HEALTH BARS (with Vision & Camera)
     ***************************************/
    function tileToPixel(coord) { return coord * tileSize; }

    function drawDynamicLighting(cameraX, cameraY) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      let playerScreenX = tileToPixel(player.x + player.size/2) - cameraX;
      let playerScreenY = tileToPixel(player.y + player.size/2) - cameraY;
      let lightRadius = 200 + (player.visionUpgradeLevel * 20);
      let gradient = ctx.createRadialGradient(playerScreenX, playerScreenY, lightRadius * 0.2, playerScreenX, playerScreenY, lightRadius);
      gradient.addColorStop(0, "rgba(0, 0, 0, 0)");
      gradient.addColorStop(1, "rgba(0, 0, 0, 0.6)");
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = "source-over";
      ctx.restore();
    }

    const crackPatterns = {
      light: [ [0.2, 0.2, 0.4, 0.4], [0.6, 0.1, 0.8, 0.3], [0.1, 0.7, 0.3, 0.9] ],
      medium: [ [0.1, 0.1, 0.5, 0.5], [0.7, 0.2, 0.9, 0.6], [0.2, 0.7, 0.6, 0.9], [0.5, 0.4, 0.8, 0.8] ],
      heavy: [ [0.1, 0.1, 0.9, 0.9], [0.2, 0.3, 0.8, 0.7], [0.3, 0.1, 0.7, 0.4], [0.1, 0.6, 0.4, 0.9], [0.6, 0.5, 0.9, 0.8] ]
    };

    const mineralPatterns = [
      [0.3, 0.3, 0.7, 0.7],
      [0.2, 0.5, 0.8, 0.5],
      [0.5, 0.2, 0.5, 0.8]
    ];

    const doorPatterns = [
      [0.1, 0.1, 0.9, 0.9],
      [0.1, 0.9, 0.9, 0.1],
      [0.5, 0.1, 0.5, 0.9],
      [0.1, 0.5, 0.9, 0.5]
    ];

    function drawCracks(x, y, width, height, hpPercent) {
      if (hpPercent >= 1) return;
      const originalLineWidth = ctx.lineWidth;
      ctx.strokeStyle = "rgba(0, 0, 0, 0.5)";
      ctx.lineWidth = 2;
      if (hpPercent <= 0.75) {
        crackPatterns.light.forEach(([x1, y1, x2, y2]) => { ctx.beginPath(); ctx.moveTo(x + x1 * width, y + y1 * height); ctx.lineTo(x + x2 * width, y + y2 * height); ctx.stroke(); });
      }
      if (hpPercent <= 0.5) {
        crackPatterns.medium.forEach(([x1, y1, x2, y2]) => { ctx.beginPath(); ctx.moveTo(x + x1 * width, y + y1 * height); ctx.lineTo(x + x2 * width, y + y2 * height); ctx.stroke(); });
      }
      if (hpPercent <= 0.25) {
        crackPatterns.heavy.forEach(([x1, y1, x2, y2]) => { ctx.beginPath(); ctx.moveTo(x + x1 * width, y + y1 * height); ctx.lineTo(x + x2 * width, y + y2 * height); ctx.stroke(); });
      }
      ctx.lineWidth = originalLineWidth;
    }

    function drawMineralAnimation(x, y, width, height, startTime) {
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
      ctx.lineWidth = 2;
      const animationSpeed = 2000;
      const currentTime = Date.now();
      const cyclePosition = ((currentTime - startTime) % animationSpeed) / animationSpeed;
      mineralPatterns.forEach(([x1, y1, x2, y2], index) => {
        const offset = (cyclePosition + index / mineralPatterns.length) % 1;
        ctx.beginPath();
        ctx.moveTo(x + x1 * width, y + y1 * height);
        ctx.lineTo(x + (x1 + (x2 - x1) * offset) * width, y + (y1 + (y2 - y1) * offset) * height);
        ctx.stroke();
      });
      ctx.restore();
    }

    function drawDoorAnimation(x, y, width, height, isLocked) {
      ctx.save();
      ctx.strokeStyle = isLocked ? "rgba(255, 0, 0, 0.5)" : "rgba(0, 255, 0, 0.5)";
      ctx.lineWidth = 3;
      const animationSpeed = 3000;
      const cyclePosition = (Date.now() % animationSpeed) / animationSpeed;
      doorPatterns.forEach(([x1, y1, x2, y2], index) => {
        const offset = (cyclePosition + index / doorPatterns.length) % 1;
        ctx.beginPath();
        ctx.moveTo(x + (x1 + (x2 - x1) * offset) * width, y + (y1 + (y2 - y1) * offset) * height);
        ctx.lineTo(x + x2 * width, y + y2 * height);
        ctx.stroke();
      });
      ctx.restore();
    }

    function drawCoordinates() {
      const padding = 10, lineHeight = 20;
      let y = canvas.height - padding;
      ctx.font = "16px Arial";
      ctx.fillStyle = "white";
      ctx.textAlign = "right";
      ctx.fillText(`Player: (${player.x}, ${player.y})`, canvas.width - padding, y);
      y -= lineHeight;
      const levelPortals = portalLocations[currentLevel] || {};
      if (levelPortals.next) { ctx.fillText(`Next Portal: (${levelPortals.next.x}, ${levelPortals.next.y})`, canvas.width - padding, y); y -= lineHeight; }
      if (levelPortals.prev) { ctx.fillText(`Previous Portal: (${levelPortals.prev.x}, ${levelPortals.prev.y})`, canvas.width - padding, y); }
    }

    function render() {
      updateVision();
      let playerCenterX = tileToPixel(player.x + player.size/2);
      let playerCenterY = tileToPixel(player.y + player.size/2);
      let cameraX = playerCenterX - canvas.width / 2;
      let cameraY = playerCenterY - canvas.height / 2;

      // Load visible chunks
      loadVisibleChunks(cameraX, cameraY);

      // Periodically unload distant chunks
      if (Math.random() < 0.01) { // 1% chance per frame
        unloadDistantChunks();
      }

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // Calculate visible chunk range
      const startChunkX = Math.floor(cameraX / (CHUNK_SIZE * tileSize));
      const endChunkX = Math.ceil((cameraX + canvas.width) / (CHUNK_SIZE * tileSize));
      const startChunkY = Math.floor(cameraY / (CHUNK_SIZE * tileSize));
      const endChunkY = Math.ceil((cameraY + canvas.height) / (CHUNK_SIZE * tileSize));

      // Only render visible chunks
      for (let chunkY = startChunkY; chunkY <= endChunkY; chunkY++) {
        for (let chunkX = startChunkX; chunkX <= endChunkX; chunkX++) {
          const chunk = getChunk(chunkX, chunkY, currentLevel);

          for (let localY = 0; localY < CHUNK_SIZE; localY++) {
            for (let localX = 0; localX < CHUNK_SIZE; localX++) {
              const tile = chunk.tiles[localY][localX];
              const worldX = chunkX * CHUNK_SIZE + localX;
              const worldY = chunkY * CHUNK_SIZE + localY;

              let baseColor = "black";
              if (tile.type === "mined") baseColor = "gray";
              else if (tile.type === "door") {
                if (tile.doorFor === "next") baseColor = (tile.doorState === "locked") ? "darkred" : "gold";
                else if (tile.doorFor === "prev") baseColor = "cyan";
              } else if (tile.type === "ore") {
                for (let lvl = 1; lvl <= maxLevel; lvl++) {
                  if (oreMapping[lvl].mineral === tile.resource) { baseColor = oreMapping[lvl].color; break; }
                }
                if (!baseColor) baseColor = "white";

                // Brighten ore color based on quality
                if (tile.quality === "perfect") {
                  baseColor = "gold";
                } else if (tile.quality === "high") {
                  // Add glow effect (brighter version)
                }
              } else if (tile.type === "ground") baseColor = getGroundColorForLevel(currentLevel);

              if (!tile.revealed) {
                ctx.fillStyle = "black";
                ctx.fillRect(tileToPixel(worldX), tileToPixel(worldY), tileSize, tileSize);
              } else {
                ctx.fillStyle = baseColor;
                ctx.fillRect(tileToPixel(worldX), tileToPixel(worldY), tileSize, tileSize);
                if (!tile.visible) {
                  ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                  ctx.fillRect(tileToPixel(worldX), tileToPixel(worldY), tileSize, tileSize);
                }
              }

              ctx.strokeStyle = "#333";
              ctx.strokeRect(tileToPixel(worldX), tileToPixel(worldY), tileSize, tileSize);

              if (tile.visible) {
                const tileX = tileToPixel(worldX), tileY = tileToPixel(worldY);
                if (tile.type === "ore") {
                  drawMineralAnimation(tileX, tileY, tileSize, tileSize, tile.animationStartTime);
                  // Add quality indicator
                  if (tile.quality === "perfect") {
                    ctx.save();
                    ctx.strokeStyle = "gold";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(tileX + 2, tileY + 2, tileSize - 4, tileSize - 4);
                    ctx.restore();
                  } else if (tile.quality === "high") {
                    ctx.save();
                    ctx.strokeStyle = "silver";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(tileX + 2, tileY + 2, tileSize - 4, tileSize - 4);
                    ctx.restore();
                  }
                }
                else if (tile.type === "door") { drawDoorAnimation(tileX, tileY, tileSize, tileSize, tile.doorState === "locked"); }
                if ((tile.type === "ground" || tile.type === "ore") && tile.maxHp > 0) {
                  const hpRatio = tile.hp / tile.maxHp;
                  drawCracks(tileX, tileY, tileSize, tileSize, hpRatio);
                }
              }
            }
          }
        }
      }

      ctx.fillStyle = "white";
      ctx.fillRect(tileToPixel(player.x), tileToPixel(player.y), tileSize * player.size, tileSize * player.size);
      ctx.restore();
      drawDynamicLighting(cameraX, cameraY);

      // Level display
      ctx.font = "24px Arial";
      ctx.fillStyle = "white";
      ctx.textAlign = "center";
      ctx.fillText(`Level ${currentLevel}`, canvas.width / 2, 30);

      // Combo display (top-left)
      if (player.comboStreak > 0) {
        ctx.textAlign = "left";
        ctx.font = "20px Arial";
        let comboColor = "white";
        if (player.comboStreak >= 50) comboColor = "gold";
        else if (player.comboStreak >= 25) comboColor = "orange";
        else if (player.comboStreak >= 10) comboColor = "yellow";
        ctx.fillStyle = comboColor;
        ctx.fillText(`${player.comboStreak}x COMBO!`, 10, 30);
        ctx.font = "14px Arial";
        ctx.fillStyle = "white";
        ctx.fillText(`+${Math.floor((getComboMultiplier() - 1) * 100)}% damage`, 10, 50);
      }

      drawInventory();
      drawShop();
      drawSkillTreeButton();
      drawCoordinates();

      // Draw skill tree (full screen overlay)
      drawSkillTree();

      // Draw skill upgrade choice modal
      drawSkillUpgradeChoice();

      if (feedbackTimer > 0) {
        ctx.font = "20px Arial";
        ctx.fillStyle = "yellow";
        ctx.textAlign = "center";
        ctx.fillText(feedbackText, canvas.width / 2, canvas.height - 50);
        feedbackTimer--;
      }

      // Level transition display (center screen, large text)
      if (levelTransitionTimer > 0) {
        ctx.save();
        ctx.font = "72px Arial";
        ctx.fillStyle = "white";
        ctx.strokeStyle = "black";
        ctx.lineWidth = 4;
        ctx.textAlign = "center";
        ctx.strokeText(levelTransitionText, canvas.width / 2, canvas.height / 2);
        ctx.fillText(levelTransitionText, canvas.width / 2, canvas.height / 2);
        ctx.restore();
        levelTransitionTimer--;
      }

      requestAnimationFrame(render);
    }

    function resetMiningState() {
      for (let [key, chunk] of chunks) {
        const [chunkX, chunkY, level] = key.split('_').map(Number);
        if (level !== currentLevel) continue;

        for (let localY = 0; localY < CHUNK_SIZE; localY++) {
          for (let localX = 0; localX < CHUNK_SIZE; localX++) {
            if (chunk.tiles[localY][localX].beingMined) {
              chunk.tiles[localY][localX].beingMined = false;
              chunk.tiles[localY][localX].animationStartTime = Date.now();
            }
          }
        }
      }
    }

    let feedbackText = "";
    let feedbackTimer = 0;
    function displayPurchaseFeedback(text) {
      feedbackText = text;
      feedbackTimer = 200;
    }

    let levelTransitionText = "";
    let levelTransitionTimer = 0;
    function displayLevelTransition(level) {
      levelTransitionText = `LEVEL ${level}`;
      levelTransitionTimer = 180; // 3 seconds at 60fps
    }

    /***************************************
     * START THE GAME (RENDER LOOP)
     ***************************************/
    // The game now starts when the user presses an arrow key or clicks (handled in the startMenu event listeners).
    // render() is called inside startGame().
  </script>
</body>
</html>
